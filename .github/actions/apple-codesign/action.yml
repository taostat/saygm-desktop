name: 'Apple Certificate Keychain Setup'
description: 'Import a Developer ID certificate into a temporary keychain for Electron Forge signing'

inputs:
  certificate-base64:
    description: 'Base64-encoded Developer ID Application .p12 certificate'
    required: true
  certificate-password:
    description: 'Password for the .p12 certificate'
    required: true
  team-id:
    description: 'Apple Developer Team ID that owns the Developer ID certificate'
    required: true

outputs:
  keychain-path:
    description: 'Path to the temporary keychain'
    value: ${{ steps.import-cert.outputs.keychain-path }}
  signing-identity:
    description: 'Explicit Developer ID Application identity imported from the certificate'
    value: ${{ steps.import-cert.outputs.signing-identity }}

runs:
  using: 'composite'
  steps:
    - name: Import Apple certificate
      id: import-cert
      shell: bash
      env:
        APPLE_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        APPLE_TEAM_ID: ${{ inputs.team-id }}
      run: |
        set -euo pipefail
        umask 077

        CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
        KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
        KEYCHAIN_LIST_PATH="$RUNNER_TEMP/signing-keychain-original-list.json"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
        trap 'rm -f "$CERTIFICATE_PATH"' EXIT

        : "${APPLE_CERTIFICATE_BASE64:?APPLE_CERTIFICATE_P12_BASE64 is required}"
        : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
        : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"

        # Save the runner's search list before creating the temporary keychain.
        # The temporary chain must be searchable by codesign, while the user's
        # default keychain and original search-list entries remain untouched.
        python3 - "$KEYCHAIN_LIST_PATH" <<'PY'
        import json
        import shlex
        import subprocess
        import sys

        output = subprocess.check_output(
            ["security", "list-keychains", "-d", "user"], text=True
        )
        paths = shlex.split(output)
        if not paths:
            raise SystemExit("The runner user keychain search list is empty.")
        with open(sys.argv[1], "w", encoding="utf-8") as snapshot:
            json.dump(paths, snapshot)
            snapshot.write("\n")
        PY

        printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
        printf 'KEYCHAIN_PATH=%s\n' "$KEYCHAIN_PATH" >> "$GITHUB_ENV"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        security import "$CERTIFICATE_PATH" \
          -k "$KEYCHAIN_PATH" \
          -P "$APPLE_CERTIFICATE_PASSWORD" \
          -T /usr/bin/codesign

        security set-key-partition-list \
          -S apple-tool:,apple: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

        python3 - "$KEYCHAIN_LIST_PATH" "$KEYCHAIN_PATH" <<'PY'
        import json
        import shlex
        import subprocess
        import sys

        with open(sys.argv[1], encoding="utf-8") as snapshot:
            original = json.load(snapshot)
        temporary = sys.argv[2]
        if temporary in original:
            raise SystemExit("Temporary signing keychain unexpectedly exists in the original search list.")
        expected = [*original, temporary]
        subprocess.run(
            ["security", "list-keychains", "-d", "user", "-s", *expected],
            check=True,
            stdout=subprocess.DEVNULL,
        )
        actual = shlex.split(
            subprocess.check_output(
                ["security", "list-keychains", "-d", "user"], text=True
            )
        )
        if actual != expected:
            raise SystemExit("The temporary signing keychain search list could not be verified.")
        PY

        identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
          | sed -nE 's/^[[:space:]]*[0-9]+\) [A-Fa-f0-9]{40} "([^"]+)"$/\1/p' \
          | grep '^Developer ID Application:' \
          | grep -F "($APPLE_TEAM_ID)" || true)"
        identity_count="$(printf '%s\n' "$identities" | awk 'NF { count++ } END { print count + 0 }')"
        if [[ "$identity_count" != 1 ]]; then
          echo "::error::Expected exactly one Developer ID Application identity for the configured Apple team."
          exit 1
        fi
        SIGNING_IDENTITY="$identities"

        {
          printf 'keychain-path=%s\n' "$KEYCHAIN_PATH"
          printf 'signing-identity=%s\n' "$SIGNING_IDENTITY"
        } >> "$GITHUB_OUTPUT"
