name: Build Ubuntu desktop artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 22.04 x64 RC5
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install system build and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake curl dpkg-dev fakeroot file \
            libasound2-dev libdbus-1-dev libsecret-1-dev libxcb1-dev \
            libxcb-util-dev libxkbfile-dev libx11-xcb-dev libxss-dev \
            libnss3-dev libgbm-dev libgtk-3-dev libnotify-dev \
            libgdk-pixbuf2.0-dev libvulkan-dev libvulkan1 \
            protobuf-compiler pkg-config python3 unzip xvfb xauth \
            dbus-x11 gnome-keyring libsecret-tools

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-x64-rc5
          cache-on-failure: true

      - name: Install locked Node workspace
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build, package, and verify Ubuntu x64 artifacts
        run: scripts/build-ubuntu-release.sh "$GITHUB_WORKSPACE/artifacts"

      - name: Install and inspect Debian package
        run: |
          sudo apt-get install --yes --no-install-recommends ./artifacts/SayGM-0.1.0-rc.5-linux-x64.deb
          test "$(dpkg-query -W -f='${Architecture}' saygm)" = amd64
          test -x /usr/bin/saygm
          test -x /usr/lib/saygm/SayGM
          test -x /usr/lib/saygm/resources/bin/goose
          desktop_file="$(dpkg-query -L saygm | grep '/applications/.*\.desktop$' | head -n 1)"
          test -n "$desktop_file"
          grep -Fx 'Exec=/usr/bin/saygm %U' "$desktop_file"
          grep -Fx 'Icon=saygm' "$desktop_file"
          ldd /usr/lib/saygm/resources/bin/goose | tee artifacts/goose-ldd.txt
          ! grep -F 'not found' artifacts/goose-ldd.txt

      - name: Smoke test native app and protected storage
        run: |
          set -euo pipefail
          export QA_KEYRING_PASSWORD="saygm-rc5-disposable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dbus-run-session -- bash -euo pipefail -s <<'BASH'
            export XDG_RUNTIME_DIR="${RUNNER_TEMP}/saygm-runtime"
            export XDG_DATA_HOME="${RUNNER_TEMP}/saygm-xdg-data"
            export XDG_CONFIG_HOME="${RUNNER_TEMP}/saygm-xdg-config"
            mkdir -p "$XDG_RUNTIME_DIR"
            mkdir -p "$XDG_DATA_HOME"
            mkdir -p "$XDG_CONFIG_HOME"
            chmod 700 "$XDG_RUNTIME_DIR"
            trap "rm -rf \"$XDG_RUNTIME_DIR\" \"$XDG_DATA_HOME\" \"$XDG_CONFIG_HOME\"" EXIT
            if ! printf "%s" "$QA_KEYRING_PASSWORD" | gnome-keyring-daemon --unlock --components=secrets >/dev/null; then
              printf "%s" "$QA_KEYRING_PASSWORD" | gnome-keyring-daemon --start --components=secrets >/dev/null
            fi
            xvfb-run -a node scripts/qa-native-desktop.mjs \
              --app /usr/lib/saygm/SayGM \
              --backend /usr/lib/saygm/resources/bin/goose \
              --expect-storage available \
              --password-store gnome-libsecret \
              --report "$GITHUB_WORKSPACE/artifacts/qa-native-secret-service.json"
            xvfb-run -a node scripts/qa-native-desktop.mjs \
              --app /usr/lib/saygm/SayGM \
              --backend /usr/lib/saygm/resources/bin/goose \
              --expect-storage unavailable \
              --password-store basic \
              --report "$GITHUB_WORKSPACE/artifacts/qa-native-basic-storage.json"
          BASH

      - name: Write final checksums
        run: |
          cd artifacts
          sha256sum SayGM-0.1.0-rc.5-linux-x64.deb SayGM-0.1.0-rc.5-linux-x64.zip > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saygm-desktop-0.1.0-rc.5-ubuntu-x64-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
